name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ✅ OIDC 認証に必要
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: fgo-servant-quiz
  REGION: asia-northeast1
  REPOSITORY: fgo-quiz
  IMAGE_NAME: frontend
  SERVICE_NAME: fgo-servant-quiz-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------
      # ソースコード取得
      # ------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------
      # Workload Identity Federation 認証
      # ------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ------------------------------------
      # gcloud CLI セットアップ
      # ------------------------------------
      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # ------------------------------------
      # Node.js セットアップ
      # ------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ------------------------------------
      # 依存関係インストール
      # ------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------
      # ビルド（Next.js）
      # ------------------------------------
      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_OGP_BASE_URL: ${{ secrets.NEXT_PUBLIC_OGP_BASE_URL }}
        run: npm run build

      - name: Debug which SA is being impersonated
        run: |
          gcloud --verbosity=debug auth print-access-token 2>&1 | tee debug-log.txt | grep "serviceAccounts"
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}

      # ------------------------------------
      # Artifact Registry 認証設定
      # ------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}

      # ------------------------------------
      # Docker イメージビルド
      # ------------------------------------
      - name: Build Docker image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_OGP_BASE_URL: ${{ secrets.NEXT_PUBLIC_OGP_BASE_URL }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_OGP_BASE_URL="${{ secrets.NEXT_PUBLIC_OGP_BASE_URL }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # ------------------------------------
      # Artifact Registry へ push
      # ------------------------------------
      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}

      # ------------------------------------
      # Cloud Run へデプロイ
      # ------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production \
            --set-env-vars NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --set-env-vars NEXT_PUBLIC_OGP_BASE_URL=${{ secrets.NEXT_PUBLIC_OGP_BASE_URL }}
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}

      # ------------------------------------
      # デプロイURL出力
      # ------------------------------------
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "✅ Frontend deployed to: $SERVICE_URL"

      # ------------------------------------
      # 古いイメージのクリーンアップ（最新5つ・latest・今回プッシュ分を保持）
      # ------------------------------------
      - name: Clean up old images
        run: |
          echo "🗑️  古いイメージを削除中（最新5つ・latestタグ・今回プッシュしたイメージを保持）..."

          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

          # 削除対象のダイジェストを選定する
          # - 作成日時の新しい順に並べ、最新5つは保持
          # - latest タグが付いたイメージは保持
          # - 今回プッシュしたイメージ（github.sha タグ）は保持
          # 削除は必ずダイジェスト指定（@sha256:...）で行うこと。
          # パッケージ名だけを指定すると、そのパッケージの全バージョンが削除されてしまう。
          DIGESTS_TO_DELETE=$(gcloud artifacts docker images list "$IMAGE_URI" \
            --include-tags \
            --sort-by="~CREATE_TIME" \
            --limit=999 \
            --format=json \
            | jq -r --arg sha "${{ github.sha }}" '
                sort_by(.createTime) | reverse | .[5:][]
                | select(((.tags // []) | index("latest") | not))
                | select(((.tags // []) | index($sha) | not))
                | .version
              ')

          if [ -n "$DIGESTS_TO_DELETE" ]; then
            echo "$DIGESTS_TO_DELETE" | while read -r digest; do
              if [ -n "$digest" ]; then
                echo "削除: $IMAGE_URI@$digest"
                gcloud artifacts docker images delete "$IMAGE_URI@$digest" --delete-tags --quiet || true
              fi
            done
            echo "✅ クリーンアップ完了"
          else
            echo "✅ 削除対象のイメージはありません"
          fi
        env:
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ${{ steps.auth.outputs.credentials_file_path }}
